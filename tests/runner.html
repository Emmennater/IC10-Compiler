<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Without this the browser happily re-runs a cached copy of this page and
     you end up verifying code you are no longer editing. -->
<meta http-equiv="Cache-Control" content="no-store">
<title>IC10 compiler refactor verification</title>
<style>
  body { font-family: Consolas, monospace; margin: 16px; background: #111; color: #ddd; }
  h1 { font-size: 16px; }
  .pass { color: #6c6; }
  .fail { color: #f66; font-weight: bold; }
  .warn { color: #fc6; }
  td, th { padding: 2px 10px; text-align: left; border-bottom: 1px solid #333; font-size: 12px; }
  pre { font-size: 11px; background: #1a1a1a; padding: 8px; overflow-x: auto; }
</style>
</head>
<body>
<h1>IC10 compiler refactor verification</h1>
<div id="log">Loading TypeScript…</div>
<div id="results"></div>
<script src="https://cdn.jsdelivr.net/npm/typescript@5.5.4/lib/typescript.js"></script>
<script>
// Every module of the compiler. Keep in sync when adding one: a missing
// entry fails loudly with "module not found" from the linker below.
const REFACTOR_FILES = [
  // leaf libraries — no dependencies on the pipeline
  "syntax.ts", "tables.ts", "ir.ts", "labels.ts", "statement-scope.ts", "folding.ts",
  // shared services
  "symbols.ts", "functions.ts", "constexpr.ts",
  // pipeline phases
  "lowering.ts", "liveness.ts", "optimize.ts", "regalloc.ts", "render.ts",
  "index.ts",
  // test support
  "tests/ast.ts", "tests/cases.ts", "tests/units.ts",
];
const EXEC_ONLY_FILES = ["tests/original.ts", "tests/original-patched.ts"];

const log = msg => { document.getElementById("log").textContent = msg; };

// cache:"no-store" matters: without it the browser can serve a stale module
// and the suite then validates code you are no longer editing.
async function fetchText(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("fetch failed: " + url + " " + r.status);
  return await r.text();
}

async function fetchLibs() {
  // Fetch lib.es2020.d.ts and, recursively, every lib it references.
  const libs = {};
  const queue = ["lib.es2020.d.ts"];
  while (queue.length) {
    const libName = queue.shift();
    if (libs["/lib/" + libName]) continue;
    const text = await fetchText("https://cdn.jsdelivr.net/npm/typescript@5.5.4/lib/" + libName);
    libs["/lib/" + libName] = text;
    for (const m of text.matchAll(/\/\/\/\s*<reference\s+lib="([^"]+)"\s*\/>/g)) {
      queue.push("lib." + m[1] + ".d.ts");
    }
  }
  return libs;
}

function typecheck(files, libs) {
  const options = {
    strict: true,
    noUnusedLocals: true,
    noUnusedParameters: true,
    noFallthroughCasesInSwitch: true,
    noImplicitOverride: true,
    target: ts.ScriptTarget.ES2020,
    module: ts.ModuleKind.CommonJS,
    moduleResolution: ts.ModuleResolutionKind.Node10,
    lib: ["lib.es2020.d.ts"],
    types: [],
    noEmit: true,
  };
  const fs = Object.assign({}, libs);
  for (const [path, text] of Object.entries(files)) fs["/" + path] = text;
  const sourceCache = {};
  const host = {
    getSourceFile: (fileName, languageVersion) => {
      const text = fs[fileName];
      if (text === undefined) return undefined;
      if (!sourceCache[fileName]) {
        sourceCache[fileName] = ts.createSourceFile(fileName, text, languageVersion, true);
      }
      return sourceCache[fileName];
    },
    getDefaultLibFileName: () => "/lib/lib.es2020.d.ts",
    getDefaultLibLocation: () => "/lib",
    writeFile: () => {},
    getCurrentDirectory: () => "/",
    getDirectories: () => [],
    fileExists: fileName => fs[fileName] !== undefined,
    readFile: fileName => fs[fileName],
    getCanonicalFileName: f => f,
    useCaseSensitiveFileNames: () => true,
    getNewLine: () => "\n",
  };
  const rootNames = REFACTOR_FILES.map(f => "/" + f);
  const programTs = ts.createProgram(rootNames, options, host);
  const diagnostics = ts.getPreEmitDiagnostics(programTs);
  return diagnostics.map(d => {
    const where = d.file
      ? d.file.fileName + ":" + (d.file.getLineAndCharacterOfPosition(d.start).line + 1)
      : "(global)";
    return where + " TS" + d.code + ": " + ts.flattenDiagnosticMessageText(d.messageText, " ");
  });
}

function makeLinker(files) {
  const transpiled = {};
  for (const [path, text] of Object.entries(files)) {
    transpiled["/" + path] = ts.transpileModule(text, {
      compilerOptions: { target: ts.ScriptTarget.ES2020, module: ts.ModuleKind.CommonJS },
      fileName: path,
    }).outputText;
  }
  const cache = {};
  function resolve(fromPath, spec) {
    const parts = fromPath.split("/").slice(0, -1);
    for (const seg of spec.split("/")) {
      if (seg === "" || seg === ".") continue;
      else if (seg === "..") parts.pop();
      else parts.push(seg);
    }
    return parts.join("/") + ".ts";
  }
  function requireModule(path) {
    if (cache[path]) return cache[path].exports;
    const js = transpiled[path];
    if (js === undefined) throw new Error("module not found: " + path);
    const module = { exports: {} };
    cache[path] = module;
    const localRequire = spec => requireModule(resolve(path, spec));
    new Function("require", "exports", "module", js)(localRequire, module.exports, module);
    return module.exports;
  }
  return requireModule;
}

function runCompiler(compileFn, ast, config) {
  try {
    return compileFn(ast, config);
  } catch (e) {
    return "ERROR: " + e.message;
  }
}

async function main() {
  const files = {};
  for (const f of [...REFACTOR_FILES, ...EXEC_ONLY_FILES]) {
    log("Fetching " + f + "…");
    files[f] = await fetchText("/" + f);
  }
  log("Fetching TypeScript lib files…");
  const libs = await fetchLibs();

  log("Type-checking (strict)…");
  const diagnostics = typecheck(files, libs);

  log("Transpiling and linking…");
  const requireModule = makeLinker(files);
  const original = requireModule("/tests/original.ts");
  const patched = requireModule("/tests/original-patched.ts");
  const refactored = requireModule("/index.ts");
  const { CASES } = requireModule("/tests/cases.ts");
  const { runUnitTests } = requireModule("/tests/units.ts");

  log("Running unit tests…");
  const unitResults = runUnitTests();
  const unitFailures = unitResults.filter(u => !u.pass);

  log("Running " + CASES.length + " differential cases…");
  const caseResults = [];
  for (const testCase of CASES) {
    const o = runCompiler(original.compile, testCase.ast, testCase.config);
    const p = runCompiler(patched.compile, testCase.ast, testCase.config);
    const r = runCompiler(refactored.compile, testCase.ast, testCase.config);
    const refEqPatched = r === p;
    const refEqOriginal = r === o;
    const expectOk = (testCase.expect ?? []).every(s => r.includes(s));
    const originalDiffOk = testCase.expectOriginalDiff ? !refEqOriginal : refEqOriginal;
    caseResults.push({
      name: testCase.name,
      pass: refEqPatched && expectOk && originalDiffOk,
      refEqPatched, refEqOriginal,
      expectOk,
      expectedOriginalDiff: !!testCase.expectOriginalDiff,
      original: o, patched: p, refactored: r,
    });
  }

  const failures = caseResults.filter(c => !c.pass);
  const results = {
    typecheckErrors: diagnostics,
    units: unitResults.length,
    unitsPassed: unitResults.length - unitFailures.length,
    unitFailures: unitFailures.map(u => u.name + (u.detail ? " — " + u.detail : "")),
    cases: caseResults.length,
    passed: caseResults.length - failures.length,
    failed: failures.length,
    failures: failures.map(f => f.name),
    detail: caseResults,
    ok: failures.length === 0 && unitFailures.length === 0 && diagnostics.length === 0,
  };
  window.__RESULTS__ = results;

  log("Done. " + results.unitsPassed + "/" + results.units + " unit tests, "
    + results.passed + "/" + results.cases + " cases passed, "
    + diagnostics.length + " type errors.");

  const el = document.getElementById("results");
  let html = "<h1 class='" + (results.ok ? "pass" : "fail") + "'>"
    + results.unitsPassed + "/" + results.units + " unit tests — "
    + results.passed + "/" + results.cases + " differential cases — "
    + diagnostics.length + " type errors</h1>";
  if (diagnostics.length) {
    html += "<pre class='fail'>" + diagnostics.join("\n") + "</pre>";
  }
  if (unitFailures.length) {
    html += "<h1 class='fail'>Failing unit tests</h1><pre class='fail'>"
      + results.unitFailures.join("\n") + "</pre>";
  }
  html += "<table><tr><th>case</th><th>=patched</th><th>=original</th><th>expects</th></tr>";
  for (const c of caseResults) {
    html += "<tr><td class='" + (c.pass ? "pass" : "fail") + "'>" + c.name + "</td>"
      + "<td class='" + (c.refEqPatched ? "pass" : "fail") + "'>" + c.refEqPatched + "</td>"
      + "<td class='" + (c.refEqOriginal === !c.expectedOriginalDiff ? "pass" : "warn") + "'>"
      + c.refEqOriginal + (c.expectedOriginalDiff ? " (diff expected)" : "") + "</td>"
      + "<td class='" + (c.expectOk ? "pass" : "fail") + "'>" + c.expectOk + "</td></tr>";
  }
  html += "</table>";
  for (const c of caseResults.filter(c => !c.pass)) {
    html += "<h1 class='fail'>" + c.name + "</h1>"
      + "<b>refactored</b><pre>" + c.refactored + "</pre>"
      + "<b>patched</b><pre>" + c.patched + "</pre>"
      + "<b>original</b><pre>" + c.original + "</pre>";
  }
  el.innerHTML = html;
}

main().catch(e => {
  log("FATAL: " + e.message);
  window.__RESULTS__ = { fatal: e.message + "\n" + (e.stack || "") };
});
</script>
</body>
</html>
