<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compiler</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <script type="module" src="main.js"></script>
  <hbox>
    <vbox id="compiler-wrapper" class="panel">
      <h1>
        <span class="title">ICC <span>v3.0</span></span>
        <span class="script-controls">
          <span id="saved-icon"></span>
          <span class="script-name-group dropdown">
            <input id="script-name" class="group-item" type="text" spellcheck="false"
                   autocomplete="off" title="Script name - type here to rename">
            <button id="script-list-toggle" class="group-item" title="Load a saved script">▾</button>
            <button id="script-new" class="group-item" title="Start a new script">+</button>
            <button id="script-delete" class="group-item" title="Delete this script">−</button>
            <ul id="script-list" class="dropdown-list" hidden></ul>
          </span>
          <button id="script-save" title="Save this script in the browser">Save</button>
          <button id="script-run" title="Run the script (Ctrl+Enter)"><span>Run</span></button>
        </span>
      </h1>
      <div id="editor" class="editor"></div>
    </vbox>
    <vbox id="ic10-wrapper" class="panel">
      <h1>
        <span class="title ic10">IC10</span>
        <span id="stats"></span>
        <span class="script-controls">
          <a class="group-item" href="docs.html" title="Open the documentation">Docs</a>
          <span class="dropdown">
            <button id="theme-toggle" title="Change the color theme"></button>
            <ul id="theme-list" class="dropdown-list" hidden></ul>
          </span>
          <button id="copy-output" title="Copy the output to the clipboard">Copy</button>
        </span>
      </h1>  
      <div id="output" class="editor"></div>
    </vbox>
  </hbox>
</body>
</html>
