<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICC Documentation</title>
  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/docs.css">
</head>
<body>
  <script type="module" src="docs.js"></script>
  <vbox id="docs-wrapper" class="panel">
    <h1>
      <span class="title">ICC <span>Docs</span></span>
      <span class="script-controls">
        <a class="group-item" href="index.html" title="Open the editor">Editor</a>
        <span class="dropdown" hidden>
          <button id="theme-toggle" title="Change the color theme"></button>
          <ul id="theme-list" class="dropdown-list"></ul>
        </span>
      </span>
    </h1>
    <hbox id="docs-body">
      <!-- Both markers are filled in by the prerender plugin in
           vite.config.js, in the dev server and in the built page alike -
           docs.markdoc.md is rendered to markup once, by Node, rather than by
           shipping Markdoc and the compiler to the browser. The plugin fails
           loudly if either marker goes missing, since the alternative is
           serving an empty page. -->
      <nav id="docs-toc"><!--docs-toc--></nav>
      <div id="docs-content" class="markdoc"><!--docs-content--></div>
    </hbox>
  </vbox>
</body>
</html>
