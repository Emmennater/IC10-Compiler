<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICC Documentation</title>
  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/docs.css">
</head>
<body>
  <script type="module" src="docs.js"></script>
  <vbox id="docs-wrapper" class="panel">
    <h1>
      <span class="title">ICC <span>Docs</span></span>
      <span class="script-controls">
        <a class="group-item" href="index.html" title="Open the editor">Editor</a>
        <span class="dropdown" hidden>
          <button id="theme-toggle" title="Change the color theme"></button>
          <ul id="theme-list" class="dropdown-list"></ul>
        </span>
      </span>
    </h1>
    <hbox id="docs-body">
      <nav id="docs-toc"></nav>
      <div id="docs-content" class="markdoc"></div>
    </hbox>
  </vbox>
</body>
</html>
